<!DOCTYPE html>
<html>
    <head>
        
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nieuwe Melding</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style/index.css') }}">

    </head>

    <body>

        <div class="container">

            <div class="header">

                <h1>Maak een nieuwe melding aan</h1>

            </div>

            <div class="navigation">

                <button class="nav_button" onclick="window.location.href='/'">Dashboard</button>
                <button class="nav_button" onclick="window.location.href='/meldingen'">Alle meldingen</button>

            </div>

            <div class="area2">
                <form class="add-form" action="{{ url_for('main.add_melding') }}" method="post">

                <div class="labels">

                    <label for="probleem">Probleem:</label><br>
                    <label for="beschrijving">Beschrijving:</label><br>
                    <label for="categorie">Categorie:</label><br>
                    <label for="status">Status:</label><br>
                    <label for="prioriteit">Prioriteit:</label><br>
                    <label for="oplossing">Oplossing:</label><br>
                </div>
                <!-- form -->
                    <div class="input">
                       
                        <input type="text" id="probleem" name="probleem" required><br>

                        <textarea id="beschrijving" name="beschrijving" required></textarea><br>

                        <!-- Categorieën ------------------------------------------------------->
                        <dropdown>
                                <select id="categorie" name="categorie">
                                    
                                    <option value="Lijn 1">Lijn 1</option>
                                    <option value="Diepdruk">Diepdruk</option>
                                    <option value="Lijn 2/3">Lijn 2/3</option>
                                    <option value="Multilijn">Multilijn</option>
                                    <option value="Infinity">Infinity</option>

                                </select>
                        </dropdown><br>

                        <!-- Prioriteiten ------------------------------------------------------>
                        <dropdown>
                                <select id="prioriteit" name="prioriteit">
                                    
                                    <option value="Laag">Laag</option>
                                    <option value="Normaal">Normaal</option>
                                    <option value="Hoog">Hoog</option>
                                    <option value="Kritiek">Kritiek</option>

                                </select>
                        </dropdown><br>

                        <!-- Status ------------------------------------------------------------>
                        <dropdown>
                                <select id="status" name="status">
                                    
                                    <option value="Nieuw">Nieuw</option>
                                    <option value="In Behandeling">In Behandeling</option>
                                    <option value="Opgelost">Opgelost</option>
                                    <option value="Gesloten">Gesloten</option>

                                </select>    
                        </dropdown><br>

                        <textarea id="oplossing" name="oplossing" placeholder="Indien geen oplossing laat dit veld leeg."></textarea><br>

                    
                    </div>

                    <div class="confirm">

                        <button type="submit" class="submit">Opslaan</button>

                    </div>
                
                </form>

            </div>

        </div>

    </body>
</html>
