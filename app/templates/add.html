<!DOCTYPE html>
<html>
    <head>
        
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nieuwe Melding</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style/index.css') }}">

    </head>

    <body>

        <div class="container">

            <div class="header">

                <h1>Maak een nieuwe melding aan</h1>

            </div>

            <div class="navigation">

                <button class="nav_button" onclick="window.location.href='/'">Dashboard</button>

            </div>

            <div class="area2">

                <form action="/add" method="post">

                    <label for="title">Probleem:</label><br>
                    <input type="text" id="title" name="title" required>

                    <label for="description">Beschrijving:</label><br>
                    <textarea id="description" name="description" required></textarea>

                    <button type="submit" class="submit">Opslaan</button>

                </form>

            </div>

        </div>

    </body>
