<!DOCTYPE html>
<html>
    <head>
        
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nieuwe Melding</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style/index.css') }}">

    </head>

    <body>

        <div class="container">

            <div class="header">

                <h1>Maak een nieuwe melding aan</h1>

            </div>

            <div class="navigation">

                <button class="nav_button" onclick="window.location.href='/'">Dashboard</button>

            </div>

            <div class="area2">

                <form action="/add" method="post">

                    <label for="probleem">Probleem:</label><br>
                    <input type="text" id="probleem" name="probleem" required>

                    <label for="beschrijving">Beschrijving:</label><br>
                    <textarea id="beschrijving" name="beschrijving" required></textarea>

                    <!-- Status ------------------------------------------------------------>
                    <dropdown>
                        <label for="status">Status:</label>
                            <select id="status" name="status">
                                
                                <option value="nieuw">Nieuw</option>
                                <option value="in_behandeling">In Behandeling</option>
                                <option value="opgelost">Opgelost</option>
                                <option value="gesloten">Gesloten</option>

                            </select>    
                    </dropdown>

                    <!-- Prioriteiten ------------------------------------------------------>
                    <dropdown>
                        <label for="priority">Prioriteit:</label>
                            <select id="priority" name="priority">
                                
                                <option value="laag">Laag</option>
                                <option value="normaal">Normaal</option>
                                <option value="hoog">Hoog</option>
                                <option value="kritiek">Kritiek</option>

                            </select>
                    </dropdown>

                    <!-- Categorieën ------------------------------------------------------->
                    <dropdown>
                        <label for="category">Categorie:</label>
                            <select id="category" name="category">
                                
                                <option value="Lijn1">Lijn 1</option>
                                <option value="diepdruk">Diepdruk</option>
                                <option value="lijn23">Lijn 2/3</option>
                                <option value="multilijn">Multilijn</option>
                                <option value="infinity">Infinity</option>

                            </select>
                    </dropdown>

                    <label for="oplossing">Oplossing:</label><br>
                    <textarea id="oplossing" name="oplossing"></textarea>

                    <button type="submit" class="submit">Opslaan</button>

                </form>

            </div>

        </div>

    </body>
</html>
